name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          # optional / experimental:
          - python-version: "3.14"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Free disk space (ubuntu-latest)
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libfftw3-dev

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up conda (Python ${{ matrix.python-version }})
        uses: conda-incubator/setup-miniconda@v4
        with:
          python-version: ${{ matrix.python-version }}
          miniforge-version: latest
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: true
          auto-update-conda: true
          mamba-version: "*"
          activate-environment: test

      - name: Install dependencies
        run: |
          conda config --set always_yes yes

          mamba install --override-channels -c conda-forge --file requirements.txt --file requirements_test.txt
          conda clean -a -y

          python -m pip install --upgrade pip setuptools
          python -m pip install --no-build-isolation .

      - name: Test with pytest
        run: |
          pytest
