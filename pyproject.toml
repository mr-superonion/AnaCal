[build-system]
requires = [
    "setuptools>=62",
    # std::variant argument casters (varianceArg etc.) need >= 2.6
    "pybind11>=2.6",
    "setuptools_scm>=6.2",
]
build-backend = "setuptools.build_meta"

[project]
name = "anacal"
dynamic = ["version"]
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "Xiangchong Li", email = "mr.superonion@hotmail.com"},
]
dependencies = [
    "numpy>=1.23",
    "galsim",
    "fitsio",
]

# docs/overview.md advertises `pip install -e ".[dev]"`; keep these in sync
# with requirements_test.txt (the conda path used by CI).
[project.optional-dependencies]
test = [
    "pytest>=3.4",
    "pytest-xdist>=1.19",
    "pytest-timeout>=1.2",
    "nbval",
    "matplotlib",
    "memory_profiler",
]
dev = [
    "pytest>=3.4",
    "pytest-xdist>=1.19",
    "pytest-timeout>=1.2",
    "nbval",
    "matplotlib",
    "memory_profiler",
    "black",
    "flake8",
    "flake8-pyproject",
]

[project.urls]
Homepage = "https://github.com/mr-superonion/AnaCal/"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
anacal = ["data/*.fits"]

# Never package in-tree extension builds (from `build_ext --inplace`) as
# package data: they would overwrite the freshly compiled extension in
# the wheel with a stale binary.  setup.py also deletes them defensively.
[tool.setuptools.exclude-package-data]
anacal = ["*.so", "*.pyd", "*.dylib"]

[tool.setuptools_scm]
version_scheme = "post-release"
# node-and-date (not dirty-tag): a bare "+dirty" version is identical for
# EVERY uncommitted state, so pip's wheel cache can serve an arbitrarily
# old build under the same version.  Including the commit hash and date
# narrows that trap; use `pip install . --no-cache-dir` for dev installs.
local_scheme = "node-and-date"
write_to = "python/anacal/__version__.py"

[tool.flake8]
ignore = [
    "N801", "N802", "N803", "N806", "N815", "N816", "W503", "W504",
    "E133", "E203", "E303", "E731", "E226", "E228"
]
exclude = [".git", "__pycache__", "docs", "build", "dist"]
max-line-length = 80

[tool.black]
line-length = 80
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 80
# generated by setuptools-scm at build time
skip = ["python/anacal/__version__.py"]

[tool.pytest.ini_options]
python_files = ["test_*.py", "example*.py", "example*.ipynb"]
testpaths = ["tests", "examples"]
addopts = "--nbval --nbval-lax --current-env -vv -s"
